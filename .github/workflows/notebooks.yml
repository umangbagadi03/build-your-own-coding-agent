name: Notebooks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, to catch breakage from dependency updates

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install requests nbformat nbclient ipykernel
      - name: Execute every notebook in offline mode
        run: python scripts/run_notebooks.py
        env:
          LLM_PROVIDER: offline
