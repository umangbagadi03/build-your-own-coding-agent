name: Lesson problem
description: A bug, a wrong claim or a confusing explanation in a notebook
title: "[Lesson] "
body:
  - type: input
    id: notebook
    attributes:
      label: Notebook
      placeholder: 03_tool_calling
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What's wrong or confusing?
      description: Quote the sentence or paste the cell, and include any error message. Remove any keys first.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Where were you running it?
      options:
        - Offline mode
        - Real provider on Colab
        - Real provider on my machine
        - Just reading on GitHub
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Provider and model, if you used one
      placeholder: Groq, llama-3.3-70b-versatile
